<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BAND 07</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0e0c;--ink:#d6e4c4;--dim:#74866a;--rec:#e0392d;--line:#2a352c;--you:#9fd3ff;--dx:0px;--dy:0px;--sk:0deg}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#020302}
body{font-family:'VT323',ui-monospace,Menlo,monospace;font-size:22px;line-height:1.15;color:var(--ink);
  text-shadow:1px 0 rgba(255,40,40,.22),-1px 0 rgba(40,200,255,.2);overflow:hidden}
#cam{position:relative;height:100%;max-width:760px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;
  padding:max(14px,env(safe-area-inset-top)) 18px max(calc(5vh + 6px),env(safe-area-inset-bottom));
  filter:contrast(1.15) saturate(.7);box-shadow:inset 0 0 90px #000,0 0 40px rgba(120,160,100,.12);
  animation:fl 9s infinite,jit 1.2s steps(2) infinite}
@keyframes fl{0%,100%{opacity:1}41%{opacity:1}42%{opacity:.88}43%{opacity:1}86%{opacity:1}87%{opacity:.8}88%{opacity:1}}
@keyframes jit{50%{translate:.6px -.5px}}
#osd{display:flex;justify-content:space-between;gap:12px;font-size:24px;flex:none}
#rec i{display:inline-block;width:.6em;height:.6em;border-radius:50%;background:var(--rec);margin-right:.4em;animation:blink 1s steps(2) infinite}
#rec.off i{animation:none;background:var(--dim)}
@keyframes blink{50%{opacity:0}}
#batt{color:var(--rec);animation:blink 1.4s steps(2) infinite}
#frame{flex:none;position:relative;margin:10px 0 6px;border:2px solid var(--line);aspect-ratio:16/9;background:#000;overflow:hidden}
#frame img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(.5) contrast(1.3) brightness(.8)}
#frame::after{content:'';position:absolute;left:0;right:0;height:14%;top:var(--ty,30%);background:rgba(255,255,255,.07);
  mix-blend-mode:screen;transform:translateX(var(--tx,0));animation:tear 3.3s steps(1) infinite}
@keyframes tear{0%{--tx:0;top:20%}30%{top:20%;transform:translateX(0)}31%{top:55%;transform:translateX(18px)}33%{top:55%;transform:translateX(-24px)}34%{top:70%;transform:translateX(0)}100%{top:70%;transform:translateX(0)}}
#frame .missing{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--dim);padding:12px}
#cap{flex:none;color:var(--dim);min-height:1.2em;font-size:20px}
#log{flex:1;overflow-y:auto;margin:6px 0;padding-right:4px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.m{margin:0 0 10px;max-width:92%}
.m b{color:var(--dim);font-weight:400;display:block;font-size:19px}
.m.you{margin-left:auto;text-align:right;color:var(--you)}
.m.sys{color:var(--rec);text-align:center;max-width:100%}
.m.clue{border:2px solid var(--rec);padding:10px;color:var(--ink);text-align:center;max-width:100%;animation:blink 2.2s steps(2) infinite}
.dots::after{content:'';animation:d 1s steps(4) infinite}
@keyframes d{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
#choices{flex:none;display:flex;flex-direction:column;gap:6px;min-height:8px}
button{font:inherit;color:var(--ink);background:transparent;border:2px solid var(--ink);padding:6px 12px;text-shadow:inherit;border-radius:0;cursor:pointer;text-align:left}
button:hover,button:focus-visible{background:var(--ink);color:var(--bg);text-shadow:none;outline:none}
#start{position:absolute;inset:0;z-index:5;background:var(--bg);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px;text-align:center;padding:24px}
#start h1{font-size:64px;font-weight:400;margin:0;animation:blink 3s steps(1) infinite}
#start p{color:var(--dim);margin:0;max-width:30ch}
/* VHS / kapot scherm */
.fx{position:fixed;inset:0;pointer-events:none;z-index:50}
#scan{background:repeating-linear-gradient(0deg,rgba(0,0,0,.4) 0 1px,transparent 1px 3px)}
#noise{opacity:.18;mix-blend-mode:screen;animation:n .4s steps(5) infinite;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23f)'/></svg>")}
@keyframes n{0%{background-position:0 0}25%{background-position:-60px 40px}50%{background-position:30px -80px}75%{background-position:-90px -20px}100%{background-position:0 0}}
#static{opacity:0;mix-blend-mode:screen;filter:contrast(3) brightness(1.3);background-size:120px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.55' numOctaves='1'/></filter><rect width='200' height='200' filter='url(%23f)'/></svg>")}
#vig{background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.85))}
#track{height:90px;top:-100px;bottom:auto;background:linear-gradient(transparent,rgba(214,228,196,.14),transparent);animation:tr 6s linear infinite}
@keyframes tr{to{transform:translateY(calc(100vh + 200px))}}
#wear{top:auto;height:5vh;background:repeating-linear-gradient(90deg,rgba(214,228,196,.035) 0 2px,transparent 2px 7px);animation:wear 1.4s steps(3) infinite}
@keyframes wear{0%{transform:translateX(0)}33%{transform:translateX(-5px) skewX(-2deg)}66%{transform:translateX(4px)}}
#flash{background:#fff;opacity:0;z-index:70}#flash.on{opacity:.9}
#black{background:#000;opacity:0;z-index:60;transition:opacity .15s}#black.on{opacity:1}
body.burst #static{opacity:.45}
body.burst #cam{transform:translate(var(--dx),var(--dy)) skewX(var(--sk));filter:contrast(1.5) saturate(.3)}
body.glitch #cam{filter:invert(1) contrast(2)}
@media (prefers-reduced-motion:reduce){#noise,#track,#wear,#cam,#rec i,#batt,.m.clue,#start h1,#frame::after{animation:none}}
</style>
</head>
<body>
<main id="cam">
  <div id="start">
    <h1>BAND 07</h1>
    <p>Teruggevonden beelden. De verbinding staat nog open. Zet je geluid zacht.</p>
    <button id="go">Speel af</button>
  </div>
  <div id="osd"><span id="rec"><i></i>REC &nbsp;CAM 02</span><span id="batt">BATT. LAAG</span><span id="clock">00:00:00</span></div>
  <div id="frame"></div>
  <div id="cap"></div>
  <div id="log" aria-live="polite"></div>
  <div id="choices"></div>
</main>
<div class="fx" id="scan"></div><div class="fx" id="noise"></div><div class="fx" id="static"></div>
<div class="fx" id="vig"></div><div class="fx" id="flash"></div><div class="fx" id="black"></div><div class="fx" id="wear"></div><div class="fx" id="track"></div>

<script>
/* ============ HIER AANPASSEN ============ */
const CONFIG = {
  pace: 1,   // 1 = normaal tempo, 1.3 = nog trager, 0.7 = sneller
  doorImage: "img/door.png",
  doorCaption: "LAATSTE BEELD ONTVANGEN. SIGNAAL VERLOREN.",
  clue: "Geen verbinding meer. De deur zit op slot. Het antwoord ligt niet hier. Het ligt in het dorp."
};

/* GELUIDEN: zet je mp3's in een map /audio. Bestaat een bestand niet, dan speelt de site
   automatisch een simpel nepgeluid, dus het werkt altijd. Pas bestandsnamen/volume aan zoals je wilt. */
const SOUNDS = {
  ambient:    {file:'audio/ambient.mp3',    vol:.25},  // lage dreun, loopt de hele tijd
  blip:       {file:'audio/blip.mp3',       vol:.25},  // elk nieuw bericht
  static:     {file:'audio/static.mp3',     vol:.5},   // beeldwissel / storing
  creak:      {file:'audio/creak.mp3',      vol:.7},   // krakende vloer / deur
  rumble:     {file:'audio/rumble.mp3',     vol:.8},   // grond begint te trillen
  fall:       {file:'audio/fall.mp3',       vol:.9},   // vallen + schreeuw
  thud:       {file:'audio/thud.mp3',       vol:1},    // harde klap
  door:       {file:'audio/door.mp3',       vol:.9},   // zware metalen deur
  disconnect: {file:'audio/disconnect.mp3', vol:.6}    // piep als iemand weggaat
};

/* STAPPEN
   msg {who,text}  img {src,cap}  sys {text}  pause {ms}  glitch
   sfx {n}         (geluid, wacht niet)    ambient {on:true/false}
   shake {ms,amp}  flash {ms}              black {ms} (scherm zwart) of black {on:true/false}
   ask {options:[{label,say,then:[...]}]}  end */
const A = "Cobbletown inwoner", B = "Which one was he again";
const STORY = [
  {t:'ambient', on:true},
  {t:'sys', text:'VERBINDING GEMAAKT. 2 GEBRUIKERS OP LOCATIE.'},
  {t:'sfx', n:'static'},
  {t:'pause', ms:2000},
  {t:'msg', who:A, text:'Hallo...? Staat dit ding aan? Iemand zei dat de feed live was.'},
  {t:'pause', ms:1200},
  {t:'msg', who:B, text:'Ja, we zien je. Wie je ook bent die dit kijkt: verlaat deze pagina niet.'},
  {t:'pause', ms:1500},
  {t:'msg', who:A, text:'We zijn binnengekomen via de oostvleugel. Het behang komt los. Er ligt veel van op de grond.'},
  {t:'pause', ms:1000},
  {t:'img', src:'img/mansion_hall.png', cap:'LANDHUIS / OOSTVLEUGEL / 02:14'},
  {t:'pause', ms:1800},
  {t:'ask', options:[
    {label:'Waar is de verhuurder?', say:'Waar is de verhuurder?', then:[
      {t:'msg', who:B, text:'Boven, denken we. Het bureau van die landlord ligt vol huurbriefjes. Honderden. Allemaal andere namen.'},
      {t:'pause', ms:2200},
      {t:'msg', who:A, text:'Een paar van die namen staan op de brievenbussen in het dorp.'}]},
    {label:'Ga daar weg.', say:'Ga daar weg.', then:[
      {t:'msg', who:A, text:'Dat hebben we geprobeerd. De deur waar we door binnenkwamen is weg. Alleen nog muur.'},
      {t:'pause', ms:2200},
      {t:'msg', who:B, text:'Blijf kijken. Dit is geen grap meer.'}]}
  ]},
  {t:'pause', ms:2500},
  {t:'msg', who:B, text:'We lopen naar de studeerkamer.'},
  {t:'pause', ms:2800},
  {t:'msg', who:B, text:'De vloer hier klinkt hol.'},
  {t:'pause', ms:2200},
  {t:'sfx', n:'creak'},
  {t:'pause', ms:2400},
  {t:'msg', who:A, text:'Hij kraakt. Niet bewegen.'},
  {t:'pause', ms:3500},
  /* de val */
  {t:'sfx', n:'rumble'},
  {t:'shake', ms:1200, amp:6},
  {t:'msg', who:A, text:'WACHT'},
  {t:'sfx', n:'fall'},
  {t:'flash', ms:120},
  {t:'black', on:true},
  {t:'shake', ms:1800, amp:30},
  {t:'sfx', n:'thud'},
  {t:'shake', ms:700, amp:40},
  {t:'sys', text:'[ VERBINDING VERLOREN ]'},
  {t:'ambient', on:false},
  {t:'pause', ms:4500},
  {t:'sfx', n:'static'},
  {t:'black', on:false},
  {t:'glitch'},
  {t:'ambient', on:true},
  {t:'sys', text:'[ VERBINDING HERSTELD ]'},
  {t:'pause', ms:2500},
  {t:'msg', who:B, text:'Au.'},
  {t:'pause', ms:3000},
  {t:'msg', who:A, text:'Ben je er nog? Ik hoor niks meer.'},
  {t:'pause', ms:2500},
  {t:'msg', who:B, text:'Ja. Ik leef nog. Het is donker. Het is een tunnel, hij gaat heel diep.'},
  {t:'pause', ms:1500},
  {t:'img', src:'img/tunnel_01.png', cap:'ONBEKEND / ONDER DE GROND / 03:41'},
  {t:'pause', ms:3500},
  {t:'msg', who:B, text:'Er liggen botten.'},
  {t:'pause', ms:2500},
  {t:'msg', who:B, text:'Oud. Sommige hebben nog huissleutels om.'},
  {t:'sfx', n:'creak'},
  {t:'pause', ms:2000},
  {t:'ask', options:[
    {label:'Wat zien jullie?', say:'Wat zien jullie?', then:[
      {t:'msg', who:A, text:'Streepjes op de muren. Maanden aan streepjes. Huurdata.'}]},
    {label:'Hoeveel zijn het er?', say:'Hoeveel zijn het er?', then:[
      {t:'msg', who:B, text:'Te veel om te tellen. Wij zijn niet de eersten. Niemand is uit het dorp weggegaan.'}]}
  ]},
  {t:'pause', ms:3500},
  {t:'msg', who:A, text:'Aan het eind is een deur. Metaal. Geen sleutelgat. Er zit iets op wat we niet snappen.'},
  {t:'pause', ms:2500},
  {t:'msg', who:B, text:'We gaan erin. Als we niet terugkomen, moet jij hem zelf open krijgen.'},
  {t:'pause', ms:3500},
  {t:'sfx', n:'door'},
  {t:'shake', ms:2500, amp:5},
  {t:'pause', ms:2500},
  {t:'ambient', on:false},
  {t:'sfx', n:'thud'},
  {t:'shake', ms:900, amp:35},
  {t:'flash', ms:200},
  {t:'black', on:true},
  {t:'pause', ms:2500},
  {t:'sfx', n:'disconnect'},
  {t:'sys', text:'COBBLETOWN INWONER HEEFT DE SESSIE VERLATEN'},
  {t:'pause', ms:1800},
  {t:'sys', text:'WHICH ONE WAS HE AGAIN HEEFT DE SESSIE VERLATEN'},
  {t:'pause', ms:3500},
  {t:'sfx', n:'static'},
  {t:'black', on:false},
  {t:'glitch'},
  {t:'end'}
];
/* ============ MOTOR ============ */
const $ = s => document.querySelector(s), log = $('#log'), frame = $('#frame'), body = document.body;
const P = ms => ms * CONFIG.pace;
const sleep = ms => new Promise(r => setTimeout(r, P(ms)));
const scroll = () => log.scrollTop = log.scrollHeight;
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function el(cls, html){ const d = document.createElement('div'); d.className = cls; d.innerHTML = html; log.appendChild(d); scroll(); return d; }

/* Geluid: eigen bestand, anders nepgeluid via WebAudio */
let ac; const ctx = () => ac || (ac = new (window.AudioContext || window.webkitAudioContext)());
function noise(dur, freq, vol, type){
  const c = ctx(), b = c.createBuffer(1, c.sampleRate * dur, c.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2-1) * (1 - i/d.length);
  const s = c.createBufferSource(); s.buffer = b; const f = c.createBiquadFilter(); f.type = type || 'lowpass'; f.frequency.value = freq;
  const g = c.createGain(); g.gain.value = vol; s.connect(f); f.connect(g); g.connect(c.destination); s.start();
}
function tone(f0, f1, dur, vol, type){
  const c = ctx(), o = c.createOscillator(), g = c.createGain(); o.type = type || 'sine';
  o.frequency.setValueAtTime(f0, c.currentTime); o.frequency.exponentialRampToValueAtTime(f1, c.currentTime + dur);
  g.gain.setValueAtTime(vol, c.currentTime); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + dur);
  o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + dur);
}
const SYN = {
  blip: () => tone(900, 700, .08, .04, 'square'),
  static: () => noise(.9, 4000, .25, 'highpass'),
  creak: () => { tone(190, 110, 1.4, .07, 'sawtooth'); tone(230, 140, 1.1, .05, 'sawtooth'); },
  rumble: () => noise(3.2, 110, .9),
  fall: () => { tone(800, 50, 2.4, .12, 'sawtooth'); noise(2.4, 700, .25); },
  thud: () => { tone(95, 30, .7, .9); noise(.5, 220, .6); },
  door: () => { tone(70, 28, 2.2, .5, 'triangle'); noise(2, 260, .35); },
  disconnect: () => tone(1000, 1000, 1.3, .06, 'square')
};
function snd(n){
  const d = SOUNDS[n]; if (!d) return; let done = false;
  const fb = () => { if (!done){ done = true; try { SYN[n] && SYN[n](); } catch(e){} } };
  const a = new Audio(d.file); a.volume = d.vol == null ? 1 : d.vol; a.onerror = fb; a.play().catch(fb);
}
let amb = null, drone = null;
function synthDrone(){
  try { const c = ctx(), o = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain();
    o.type = 'sawtooth'; o.frequency.value = 46; f.frequency.value = 120; g.gain.value = .05;
    o.connect(f); f.connect(g); g.connect(c.destination); o.start(); return {stop: () => { g.gain.value = 0; o.stop(); }}; } catch(e){ return null; }
}
function ambient(on){
  if (on){
    if (amb || drone) return;
    const d = SOUNDS.ambient, a = new Audio(d.file); a.loop = true; a.volume = d.vol;
    const fb = () => { if (!drone) drone = synthDrone(); };
    a.onerror = fb; a.play().then(() => { amb = a; }).catch(fb);
  } else {
    const a = amb; amb = null;
    if (a){ const iv = setInterval(() => { a.volume = Math.max(0, a.volume - .04); if (a.volume <= 0){ a.pause(); clearInterval(iv); } }, 80); }
    if (drone){ drone.stop(); drone = null; }
  }
}

/* Kapotte-scherm effecten */
function burst(ms){
  const r = document.documentElement.style;
  r.setProperty('--dx', (Math.random()*30-15)+'px'); r.setProperty('--dy', (Math.random()*10-5)+'px');
  r.setProperty('--sk', (Math.random()*8-4)+'deg');
  body.classList.add('burst'); setTimeout(() => body.classList.remove('burst'), ms || 120 + Math.random()*260);
}
(function loop(){ setTimeout(() => { burst(); if (Math.random() < .1) setTimeout(burst, 220); loop(); }, 6000 + Math.random()*9000); })();
function glitch(){ body.classList.add('glitch'); burst(450); setTimeout(() => body.classList.remove('glitch'), 250); }
async function shake(ms, amp){
  const c = $('#cam'), end = Date.now() + ms;
  while (Date.now() < end){ const k = (end - Date.now()) / ms, r = () => (Math.random()*2-1) * amp * k;
    c.style.transform = 'translate(' + r() + 'px,' + r() + 'px) rotate(' + r()/12 + 'deg)'; await new Promise(r => setTimeout(r, 30)); }
  c.style.transform = '';
}
function flash(ms){ const f = $('#flash'); f.classList.add('on'); setTimeout(() => f.classList.remove('on'), ms || 120); }
const junk = '▓▒░█#@%&?/\\';
function corrupt(node, text){
  let n = 0; const iv = setInterval(() => {
    node.textContent = n++ > 6 ? text : [...text].map(c => c !== ' ' && Math.random() < .18 ? junk[Math.random()*junk.length|0] : c).join('');
    if (n > 7) clearInterval(iv);
  }, 70);
}

function setFrame(src, cap){
  frame.innerHTML = ''; burst(350);
  const i = new Image(); i.alt = cap || '';
  i.onerror = () => { frame.innerHTML = '<div class="missing">[ afbeelding ontbreekt: ' + esc(src) + ' ]</div>'; };
  i.src = src; frame.appendChild(i);
  $('#cap').textContent = cap || '';
}

async function play(s){
  if (s.t === 'msg'){
    const d = el('m', '<b>' + esc(s.who) + '</b><span class="t dots"></span>');
    await sleep(Math.min(900 + s.text.length * 45, 3800));
    const t = d.querySelector('.t'); t.className = 't'; t.textContent = s.text; snd('blip'); scroll();
    if (Math.random() < .35) corrupt(t, s.text);
    await sleep(1300);
  } else if (s.t === 'sys'){ el('m sys', esc(s.text)); burst(150); await sleep(1500); }
  else if (s.t === 'img'){ setFrame(s.src, s.cap); snd('static'); await sleep(1800); }
  else if (s.t === 'glitch'){ glitch(); await sleep(900); }
  else if (s.t === 'pause'){ await sleep(s.ms); }
  else if (s.t === 'sfx'){ snd(s.n); }
  else if (s.t === 'ambient'){ ambient(s.on); }
  else if (s.t === 'shake'){ await shake(P(s.ms), s.amp || 14); }
  else if (s.t === 'flash'){ flash(s.ms); }
  else if (s.t === 'black'){
    const b = $('#black');
    if (s.ms){ b.classList.add('on'); await sleep(s.ms); b.classList.remove('on'); }
    else b.classList.toggle('on', s.on);
  }
  else if (s.t === 'ask'){
    const box = $('#choices');
    const pick = await new Promise(res => {
      s.options.forEach(o => { const b = document.createElement('button'); b.textContent = o.label; b.onclick = () => res(o); box.appendChild(b); });
      box.firstChild.focus({preventScroll:true});
    });
    box.innerHTML = ''; el('m you', esc(pick.say)); await sleep(1200);
    await run(pick.then || []);
  } else if (s.t === 'end'){ await ending(); }
}
async function run(steps){ for (const s of steps) await play(s); }

async function ending(){
  $('#rec').classList.add('off'); $('#batt').textContent = 'GEEN SIGNAAL';
  setFrame(CONFIG.doorImage, CONFIG.doorCaption);
  el('m sys', esc(CONFIG.doorCaption));
  await sleep(4000);
  el('m clue', esc(CONFIG.clue));
}

$('#go').onclick = () => {
  $('#start').remove(); const t0 = Date.now(); burst(300);
  setInterval(() => { const s = Math.floor((Date.now() - t0) / 1000), p = n => String(n).padStart(2, '0');
    $('#clock').textContent = p(s/3600|0) + ':' + p(s/60%60|0) + ':' + p(s%60); }, 1000);
  setFrame('img/start.png', 'WACHTEN OP SIGNAAL');
  run(STORY);
};
</script>
</body>
</html>
